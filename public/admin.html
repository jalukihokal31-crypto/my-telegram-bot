<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Touch Earning BD</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #f1f5f9; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { color: #d32f2f; margin-bottom: 20px; font-size: 18px; text-align: center; }
    .task-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .approve-btn { background: #10b981; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
    <h2><i class="fas fa-shield-alt"></i> রিয়েল-টাইম অ্যাডমিন প্যানেল</h2>
    <div id="pending-tasks">লোড হচ্ছে...</div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAiPHEgdjN9KEdC6ZXUyp6MAcsPBrW6sGY",
      authDomain: "touchearning-59948.firebaseapp.com",
      databaseURL: "https://touchearning-59948-default-rtdb.firebaseio.com",
      projectId: "touchearning-59948",
      storageBucket: "touchearning-59948.firebasestorage.app",
      messagingSenderId: "595979395734",
      appId: "1:595979395734:web:4961aca984dfdc952418b7",
      measurementId: "G-5S78F63CKK"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let taskListDiv = document.getElementById('pending-tasks');

    db.ref('tasks').on('value', snapshot => {
        let tasks = snapshot.val();
        if (!tasks) {
            taskListDiv.innerHTML = "<p style='text-align:center; color:#666;'>কোনো পেন্ডিং টাস্ক নেই।</p>";
            return;
        }

        let html = '';
        Object.keys(tasks).forEach(key => {
            let t = tasks[key];
            if (t.status === 'Pending') {
                html += `
                    <div class="task-box">
                        <div>
                            <b>${t.userName} (#${t.uid})</b><br>
                            <small>Type: ${t.type} | Acc: ${t.accId} | Pass: ${t.pass}</small><br>
                            <span style="color:red; font-weight:bold;">Rate: ৳${t.rate}</span>
                        </div>
                        <button class="approve-btn" onclick="approveTask('${key}', '${t.uid}', ${t.rate})">অ্যাপ্রুভ</button>
                    </div>
                `;
            }
        });
        taskListDiv.innerHTML = html || "<p style='text-align:center; color:#666;'>কোনো পেন্ডিং টাস্ক নেই।</p>";
    });

    function approveTask(taskKey, uid, rate) {
        db.ref('tasks/' + taskKey).update({ status: 'Approved' }).then(() => {
            let userBalRef = db.ref('users/' + uid + '/bal');
            userBalRef.once('value').then(snap => {
                let currentBal = snap.val() || 0;
                userBalRef.set(currentBal + rate).then(() => {
                    alert('টাস্ক সফলভাবে অ্যাপ্রুভ হয়েছে এবং ব্যালেন্স যোগ হয়েছে!');
                });
            });
        });
    }
</script>
</body>
</html>
