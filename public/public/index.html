<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touch Earning BD - Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #311042);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            margin-top: 20px;
        }
        h1 { font-size: 22px; color: #38bdf8; margin-bottom: 10px; }
        p { color: #cbd5e1; font-size: 14px; }
        .balance-box {
            background: #0ea5e9;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }
        .btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Touch Earning BD</h1>
        <p>আপনার ড্যাশবোর্ড ও আর্নিং স্ট্যাটাস</p>
        
        <div class="balance-box" id="userBalance">৳0.00</div>
        
        <button class="btn" onclick="claimBonus()">ডেইলি বোনাস ক্লেম করুন</button>
    </div>

    <script>
        // টেলিগ্রাম ওয়েব অ্যাপ ইনিশিয়ালাইজেশন
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 0.00;

        function claimBonus() {
            balance += 10.00;
            document.getElementById('userBalance').innerText = '৳' + balance.toFixed(2);
            tg.showAlert('সফলভাবে ১০ টাকা বোনাস যোগ হয়েছে!');
        }
    </script>
</body>
</html>
